<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="color-scheme" content="light">
<title>Painel — Imobiliária Deon</title>
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<header class="app-bar">
  <button class="btn-ghost" id="btn-menu" aria-label="Menu" style="font-size:22px; padding:6px 10px;">☰</button>
  <img src="img/logo-dourado-transparente.png" alt="Deon">
  <div style="display:flex; align-items:center; gap:12px;">
    <span class="corretor-nome" id="nome-corretor"></span>
    <button class="btn-ghost" id="btn-sair" title="Sair" aria-label="Sair">Sair</button>
  </div>
</header>

<div class="drawer-fundo" id="drawer-fundo"></div>
<nav class="drawer" id="drawer">
  <div class="drawer-topo">
    <div class="drawer-nome" id="drawer-nome-corretor"></div>
    <div class="drawer-email" id="drawer-email-corretor"></div>
  </div>
  <a href="#/novo" class="drawer-cta" data-fechar>+ Gerar contrato</a>
  <div class="drawer-separador"></div>
  <a href="#/dashboard" class="drawer-item" data-fechar>Contratos</a>
  <a href="#/perfil" class="drawer-item" data-fechar>Meu login</a>
  <a href="#/proposta" class="drawer-item" data-fechar>Gerar proposta</a>
  <a href="#/corretores/novo" class="drawer-item" id="link-cadastrar-corretor" data-fechar style="display:none;">Cadastrar corretor</a>
</nav>

<main id="app"></main>

<div class="toast" id="toast"></div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
