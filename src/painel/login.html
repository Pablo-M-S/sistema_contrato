<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="color-scheme" content="light">
<title>Entrar — Imobiliária Deon</title>
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<div class="tela-login">
  <div style="text-align:center; margin-bottom:40px;">
    <img src="img/logo-dourado-transparente.png" alt="Deon Imobiliária" style="width:100%; max-width:280px;">
  </div>

  <h1 class="display" style="font-size:20px; text-align:center; color:var(--text-dim); font-weight:500; margin-bottom:28px;">
    Painel do corretor
  </h1>

  <form id="form-login">
    <div class="campo" id="campo-email">
      <label for="email">E-mail</label>
      <input type="email" id="email" autocomplete="username" required inputmode="email">
      <div class="erro">Informe um e-mail válido.</div>
    </div>

    <div class="campo" id="campo-senha">
      <label for="senha">Senha</label>
      <div class="campo-senha-wrap">
        <input type="password" id="senha" autocomplete="current-password" required>
        <button type="button" class="btn-olho" id="btn-olho" aria-label="Mostrar senha" tabindex="-1">
          <svg id="icone-olho" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>
      <div class="erro">Informe sua senha.</div>
    </div>

    <button type="submit" class="btn btn-primary" id="btn-entrar">
      <span id="btn-entrar-texto">Entrar</span>
    </button>
  </form>
</div>

<div class="toast" id="toast"></div>

<script src="js/api.js"></script>
<script>
  // já logado -> vai direto pro painel
  if (Api.token()) window.location.href = 'index.html';

  const form = document.getElementById('form-login');
  const btn = document.getElementById('btn-entrar');
  const btnTexto = document.getElementById('btn-entrar-texto');

  const campoSenha = document.getElementById('senha');
  const btnOlho = document.getElementById('btn-olho');
  btnOlho.addEventListener('click', () => {
    const visivel = campoSenha.type === 'text';
    campoSenha.type = visivel ? 'password' : 'text';
    btnOlho.classList.toggle('ativo', !visivel);
    btnOlho.setAttribute('aria-label', visivel ? 'Mostrar senha' : 'Ocultar senha');
  });

  function mostrarToast(msg, erro) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast mostrar' + (erro ? ' erro' : '');
    setTimeout(() => t.classList.remove('mostrar'), 3500);
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const senha = document.getElementById('senha').value;

    document.getElementById('campo-email').classList.toggle('invalido', !email);
    document.getElementById('campo-senha').classList.toggle('invalido', !senha);
    if (!email || !senha) return;

    btn.disabled = true;
    btnTexto.innerHTML = '<span class="spinner"></span>';

    try {
      const resp = await Api.login(email, senha);
      // aceita { token, corretor } ou variações de nome de campo
      const token = resp.token || resp.jwt || resp.accessToken;
      const corretor = resp.corretor || resp.usuario || resp.user || {};
      if (!token) throw new Error('Resposta de login inesperada do servidor.');
      Api.salvarSessao(token, corretor);
      window.location.href = 'index.html';
    } catch (err) {
      mostrarToast(err.message || 'Não foi possível entrar.', true);
      btn.disabled = false;
      btnTexto.textContent = 'Entrar';
    }
  });
</script>
</body>
</html>
